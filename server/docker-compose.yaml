services:
    taskflow: 
      build: 
        context: ${PROJECT_ROOT}
        dockerfile: ${PROJECT_ROOT}/Dockerfile
      container_name: taskflow-server
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT}
        HTTP_ADDR: :8080
        HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT}
        LOGGER_LEVEL: ${LOGGER_LEVEL}
        TIME_ZONE: ${TIME_ZONE}
        LOGGER_FOLDER: ./logs
        POSTGRES_HOST: db
      volumes:
        - ${PROJECT_ROOT}/logs:/app/logs
      ports:
        - "8080:8080"
      restart: always
    db: 
      container_name: taskflow-postgres
      image: postgres:18.1-bookworm
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes: 
      - ${PROJECT_ROOT}/postgres_data:/var/lib/postgresql
      restart: always
    migrate:  
      image: migrate/migrate:v4.19.1
      volumes:
        - ${PROJECT_ROOT}/migrations:/migrations
      depends_on:
        - db
      
      
    port-forwarder:
      image: alpine/socat:1.8.0.3
      container_name: port-forwarder
      command: tcp-listen:5432,fork,reuseaddr tcp-connect:db:5432
      ports:
      - "127.0.0.1:5432:5432"
      