services:
    db: 
      container_name: taskflow-postgres
      image: postgres:18.1-bookworm
      environment:
         POSTGRES_USER: ${POSTGRES_USER}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: ${POSTGRES_DB}
      volumes: 
      - ${PROJECT_ROOT}/postgres_data:/var/lib/postgresql
      restart: always
    migrate:  
      image: migrate/migrate:v4.19.1
      volumes:
        - ${PROJECT_ROOT}/migrations:/migrations
      depends_on:
        - db
      
      
    port-forwarder:
      image: alpine/socat:1.8.0.3
      container_name: port-forwarder
      command: tcp-listen:5432,fork,reuseaddr tcp-connect:db:5432
      ports:
      - "127.0.0.1:5432:5432"
      